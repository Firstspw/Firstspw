<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610">
<defs>
  <!-- Gradient สำหรับตัวอักษร ASCII Art -->
  <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#38BDF8">
      <animate attributeName="stop-color" values="#38BDF8;#818CF8;#C084FC;#38BDF8" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#C084FC">
      <animate attributeName="stop-color" values="#C084FC;#38BDF8;#818CF8;#C084FC" dur="8s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>

  <!-- Gradient ขอบการ์ด -->
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="50%" stop-color="#818CF8"/>
    <stop offset="100%" stop-color="#34D399"/>
  </linearGradient>

  <!-- Dark Background & Scanlines -->
  <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%">
    <stop offset="0%" stop-color="#0F172A"/>
    <stop offset="100%" stop-color="#020617"/>
  </radialGradient>

  <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
    <rect width="100" height="2" fill="#000000" opacity="0.3"/>
  </pattern>

  <!-- Animation Mask ทำให้ภาพ ASCII ค่อยๆ แสดงลงมาจากบนลงล่าง -->
  <mask id="asciiMask" maskUnits="userSpaceOnUse" x="0" y="0" width="500" height="610">
    <rect x="0" y="0" width="500" height="0" fill="#FFFFFF">
      <animate attributeName="height" from="0" to="520" dur="2.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
  </mask>

  <!-- Animation ClipPaths ทำให้ข้อความฝั่งขวาค่อยๆ พิมพ์ออกมาทีละบรรทัด -->
  <clipPath id="lc0"><rect x="500" y="26" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="0.5s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc1"><rect x="500" y="50" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="0.65s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc2"><rect x="500" y="72" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="0.8s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc3"><rect x="500" y="94" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="0.95s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc4"><rect x="500" y="116" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="1.1s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc5"><rect x="500" y="138" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="1.25s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc6"><rect x="500" y="160" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="1.4s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc7"><rect x="500" y="204" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="1.55s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc8"><rect x="500" y="226" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="1.7s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc9"><rect x="500" y="248" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="1.85s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc10"><rect x="500" y="270" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="2.0s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc11"><rect x="500" y="292" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="2.15s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc12"><rect x="500" y="336" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="2.3s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc13"><rect x="500" y="358" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="2.45s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc14"><rect x="500" y="380" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="2.6s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc15"><rect x="500" y="402" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="2.75s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc16"><rect x="500" y="446" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="2.9s" fill="freeze"/></rect></clipPath>
  <clipPath id="lc17"><rect x="500" y="468" width="0" height="24"><animate attributeName="width" from="0" to="650" dur="0.35s" begin="3.05s" fill="freeze"/></rect></clipPath>

  <style>
    .ascii { font-family: 'Courier New', Consolas, monospace; font-size: 8px; fill: url(#asciiGrad); font-weight: bold; }
    .key   { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #38BDF8; font-weight: bold; }
    .value { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #F8FAFC; }
    .cc    { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #475569; }
    .head  { font-family: 'Courier New', Consolas, monospace; font-size: 17px; fill: #C084FC; font-weight: bold; }
    .accent{ font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #34D399; font-weight: bold; }
    .term-label { font-family: 'Courier New', Consolas, monospace; font-size: 12px; fill: #94A3B8; }
    .scan-label { font-family: 'Courier New', Consolas, monospace; font-size: 10px; fill: #EF4444; font-weight: bold; }
    .panel-title{ font-family: 'Courier New', Consolas, monospace; font-size: 11px; fill: #38BDF8; letter-spacing: 2px; opacity: 0.8; }
    .cursor-blink { fill: #38BDF8; }
    text, tspan { white-space: pre; }
  </style>
</defs>

<!-- Background -->
<rect width="1180" height="610" rx="18" fill="url(#bgGlow)"/>
<rect width="1180" height="610" rx="18" fill="url(#scanlines)"/>

<!-- Header Bar -->
<g id="titlebar">
  <rect x="3" y="3" width="1174" height="34" rx="16" fill="#0F172A" fill-opacity="0.8"/>
  <circle cx="24" cy="20" r="5" fill="#EF4444"/>
  <circle cx="42" cy="20" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="20" r="5" fill="#10B981"/>
  <text x="590" y="25" text-anchor="middle" class="term-label">dev@terminal ~ % ./profile.sh --live</text>
  <circle cx="1122" cy="20" r="4" fill="#EF4444">
    <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="1132" y="24" class="scan-label">SCANNING</text>
</g>

<!-- Main Terminal Panels -->
<g transform="translate(0,38)">
  <rect x="14" y="26" width="488" height="468" rx="14" fill="#020617" fill-opacity="0.65" stroke="url(#borderGrad)" stroke-width="1.2"/>
  <rect x="508" y="10" width="655" height="500" rx="14" fill="#020617" fill-opacity="0.65" stroke="url(#borderGrad)" stroke-width="1.2"/>
  <text x="30" y="24" class="panel-title">VISUAL.MAP</text>
  <text x="524" y="24" class="panel-title">SYSTEM.INFO</text>

  <!-- Left Side: ASCII Portrait Section (ค่อยๆ คลี่แสดงผลด้วย Mask) -->
