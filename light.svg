<tspan x="28" y="445" xml:space="preserve">----------------------------------------------------------------</tspan>
    </text>
  </g>

  <!-- Right Side: Info Panel Section (พิมพ์ทีละบรรทัด) -->
  <g clip-path="url(#lc0)"><text x="520" y="0"><tspan x="520" y="42" class="head">developer@devos</tspan><tspan class="cc"> ---—---------------------------------------—---</tspan></text></g>
  <g clip-path="url(#lc1)"><text x="520" y="0"><tspan x="520" y="66" class="cc">. </tspan><tspan class="key">Subject</tspan><tspan class="cc">: .......................... </tspan><tspan class="value">Developer Profile</tspan></text></g>
  <g clip-path="url(#lc2)"><text x="520" y="0"><tspan x="520" y="88" class="cc">. </tspan><tspan class="key">Role</tspan><tspan class="cc">: ............................. </tspan><tspan class="value">Full-Stack Developer &amp; Creator</tspan></text></g>
  <g clip-path="url(#lc3)"><text x="520" y="0"><tspan x="520" y="110" class="cc">. </tspan><tspan class="key">Origin</tspan><tspan class="cc">: ........................... </tspan><tspan class="value">Thailand</tspan></text></g>
  <g clip-path="url(#lc4)"><text x="520" y="0"><tspan x="520" y="132" class="cc">. </tspan><tspan class="key">Education</tspan><tspan class="cc">: ......................... </tspan><tspan class="value">Software Engineering / IT</tspan></text></g>
  <g clip-path="url(#lc5)"><text x="520" y="0"><tspan x="520" y="154" class="cc">. </tspan><tspan class="key">Status</tspan><tspan class="cc">: ............ </tspan><tspan class="value">Building • Learning • Shipping</tspan></text></g>
  <g clip-path="url(#lc6)"><text x="520" y="0"><tspan x="520" y="176" class="cc">. </tspan><tspan class="key">ToolChain</tspan><tspan class="cc">: ................. </tspan><tspan class="value">VS Code, Git, Docker, Terminal</tspan></text></g>

  <g clip-path="url(#lc7)"><text x="520" y="0"><tspan x="520" y="220" class="cc">. </tspan><tspan class="key">Core</tspan><tspan class="cc">.</tspan><tspan class="key">Lang</tspan><tspan class="cc">: .......... </tspan><tspan class="value">JavaScript, TypeScript, Python</tspan></text></g>
  <g clip-path="url(#lc8)"><text x="520" y="0"><tspan x="520" y="242" class="cc">. </tspan><tspan class="key">Core</tspan><tspan class="cc">.</tspan><tspan class="key">Frontend</tspan><tspan class="cc">: ...... </tspan><tspan class="value">React, HTML, CSS, Tailwind</tspan></text></g>
  <g clip-path="url(#lc9)"><text x="520" y="0"><tspan x="520" y="264" class="cc">. </tspan><tspan class="key">Core</tspan><tspan class="cc">.</tspan><tspan class="key">Backend</tspan><tspan class="cc">: ....... </tspan><tspan class="value">Node.js, Express, REST APIs</tspan></text></g>
  <g clip-path="url(#lc10)"><text x="520" y="0"><tspan x="520" y="286" class="cc">. </tspan><tspan class="key">Core</tspan><tspan class="cc">.</tspan><tspan class="key">Database</tspan><tspan class="cc">: ...... </tspan><tspan class="value">PostgreSQL, MongoDB, MySQL</tspan></text></g>
  <g clip-path="url(#lc11)"><text x="520" y="0"><tspan x="520" y="308" class="cc">. </tspan><tspan class="key">Core</tspan><tspan class="cc">.</tspan><tspan class="key">Infra</tspan><tspan class="cc">: ......... </tspan><tspan class="value">Docker, Vercel, Microservices</tspan></text></g>

  <g clip-path="url(#lc12)"><text x="520" y="0"><tspan x="520" y="352" class="accent">- Contact</tspan><tspan class="cc"> ---—---------------------------------------—---</tspan></text></g>
  <g clip-path="url(#lc13)"><text x="520" y="0"><tspan x="520" y="374" class="cc">. </tspan><tspan class="key">Grid</tspan><tspan class="cc">.</tspan><tspan class="key">Mail</tspan><tspan class="cc">: ....................... </tspan><tspan class="value">your.email@gmail.com</tspan></text></g>
  <g clip-path="url(#lc14)"><text x="520" y="0"><tspan x="520" y="396" class="cc">. </tspan><tspan class="key">Grid</tspan><tspan class="cc">.</tspan><tspan class="key">Portfolio</tspan><tspan class="cc">: .................. </tspan><tspan class="value">your-portfolio.com</tspan></text></g>
  <g clip-path="url(#lc15)"><text x="520" y="0"><tspan x="520" y="418" class="cc">. </tspan><tspan class="key">Grid</tspan><tspan class="cc">.</tspan><tspan class="key">Github</tspan><tspan class="cc">: ..................... </tspan><tspan class="value">github.com/your-username</tspan></text></g>

  <g clip-path="url(#lc16)"><text x="520" y="0"><tspan x="520" y="462" class="accent">- Live Stats</tspan><tspan class="cc"> ---—---------------------------------------—---</tspan></text></g>
  <g clip-path="url(#lc17)"><text x="520" y="0"><tspan x="520" y="484" class="cc">. </tspan><tspan class="value">See live GitHub stats badges below in README ↓</tspan></text></g>

  <!-- Cursor Blink -->
  <rect x="522" y="471" width="9" height="16" class="cursor-blink" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0" keyTimes="0;0.5;0.6;0.8;0.9;1" dur="1.2s" begin="3.2s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Glowing Outer Border -->
<rect x="3" y="3" width="1174" height="604" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.8">
  <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
</rect>
</svg>
